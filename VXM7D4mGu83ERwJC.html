<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Welcome · Bezares</title>
<link rel="stylesheet" href="assets/kiosk.css">
<link rel="icon" href="assets/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="assets/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<script src="assets/icons.js" defer></script>
<script src="assets/kiosk.js" defer></script>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <header id="header" hidden><img alt=""></header>

  <main id="main">
    <div id="welcome"><span id="welcome-text" class="show"></span></div>

    <div class="deco" id="deco1" aria-hidden="true"><i></i><b></b><i></i></div>

    <!-- Sin textos centrales: el vídeo se reproduce aquí, en lugar de la línea decorativa -->
    <div id="cvideo" hidden><div class="vbox"></div></div>

    <div id="center" hidden>
      <div id="center-text" class="ctext" hidden></div>
      <div id="center-text2" class="ctext" hidden></div>
    </div>

    <div class="deco" id="deco2" aria-hidden="true" hidden><i></i><b></b><i></i></div>

    <div id="logo"><img alt=""></div>
  </main>

  <div id="footer-title" hidden></div>
  <footer id="footer"><div id="footer-icons"></div></footer>

  <div id="reloading" hidden><span></span></div>
</body>
</html>
